<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isoko Admin</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>:root{--bg:#f6efe6;--card:#fffaf3;--ink:#1b1511;--brown:#6b3e25;--gold:#d7a763;--muted:#74685f;--line:#ded0c0;--danger:#9d3327}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.brand{font:700 30px 'Playfair Display'}.brand small{display:block;font:700 9px 'DM Sans';letter-spacing:.25em;color:var(--brown)}button,input{font:inherit}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:var(--brown);color:white}.ghost{background:transparent;border:1px solid var(--line)}.danger{background:#f8e4e0;color:var(--danger)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:18px}.auth{max-width:460px;margin:8vh auto}.auth h1{font:700 42px 'Playfair Display';margin:8px 0}.muted{color:var(--muted)}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:white}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:18px;border:1px solid var(--line);border-radius:14px;background:white}.stat b{display:block;font-size:28px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{background:white;border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer}.tab.active{background:var(--brown);color:white}.hidden{display:none!important}.item{display:grid;grid-template-columns:1fr 130px auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee4d8}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.thumb{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:white}.thumb img{width:100%;height:150px;object-fit:cover;display:block}.thumb .cap{padding:9px}.msg{margin:12px 0;padding:11px;border-radius:10px;background:#eee8df}.success{background:#e5f1e8;color:#245c35}.error{background:#f8e4e0;color:#8b2b22}@media(max-width:750px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr}.thumbs{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div id="app"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./admin.js"></script></body></html>
